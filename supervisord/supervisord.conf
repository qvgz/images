[supervisord]
logfile=/dev/stdout
loglevel=info

# Web UI 与 supervisord ctl 依赖；对外暴露务必设置账号密码
[inet_http_server]
port=0.0.0.0:9001
username=admin
password=changeme

[supervisorctl]
serverurl=http://127.0.0.1:9001
username=admin
password=changeme

# 所有 program 的默认值
[program-default]
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout

# 示例：常驻进程，必须前台运行
[program:ticker]
command=/bin/sh -c 'while true; do echo "tick $(date)"; sleep 30; done'

# 示例：定时任务，任务写在 /etc/crontabs/root
[program:crond]
command=/usr/sbin/crond -f -l 2

# 拆分配置，支持通配
# [include]
# files=/etc/supervisor.d/*.conf
