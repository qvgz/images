name: 手动构建推送

on:
  workflow_dispatch:
    inputs:
      image:
        description: "镜像"
        required: true
        type: choice
        options:
        - docker-health
        - docker-image-clean
        - log-clean
        - rdap
        - watchexec
      version:
        description: "额外版本标签（可选），始终推送 latest；同时作为构建参数 VERSION（watchexec 为上游 tag，如 v2.8.0，空则最新）"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./${{ inputs.image }}
        file: ./${{ inputs.image }}/Dockerfile
        push: true
        platforms: linux/amd64
        build-args: |
          VERSION=${{ inputs.version }}
        tags: |
          qvgz/${{ inputs.image }}:latest
          ${{ inputs.version && format('qvgz/{0}:{1}', inputs.image, inputs.version) || '' }}
