# Caddy JSON 访问日志：访问 /admin、/admin/...、/admin?... 即命中
# 取 request.client_ip；Caddy 在 CDN/反代后需配置 trusted_proxies，否则为代理 IP
# Caddy JSON 访问日志：命中以下路径即封禁
# 取 request.client_ip；Caddy 在 CDN/反代后需配置 trusted_proxies，否则为代理 IP[span_0](start_span)[span_0](end_span)
[Definition]
_prefix = ^\{.*"client_ip":"<HOST>".*?"uri":"

# 维护方式：每行一个路径，新增直接复制一行修改路径，删除直接删行或行首加 # 注释
failregex = %(_prefix)s/admin(?:[/?][^"]*)?"
            %(_prefix)s/backup(?:[/?][^"]*)?"
            %(_prefix)s/config(?:[/?][^"]*)?"
            %(_prefix)s/staging(?:[/?][^"]*)?"
            %(_prefix)s/internal/api(?:[/?][^"]*)?"
            %(_prefix)s/private/results(?:[/?][^"]*)?"
            %(_prefix)s/datasets/export(?:[/?][^"]*)?"
            %(_prefix)s/db/dump\.sql\.gz(?:\?[^"]*)?"
            %(_prefix)s/\.env(?:\?[^"]*)?"
            %(_prefix)s/\.git(?:[/?][^"]*)?"

ignoreregex =
datepattern = "ts":{EPOCH}


